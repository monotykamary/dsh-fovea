<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc">
  <title id="title">dsh-fovea repository graph</title>
  <desc id="desc">A DeepSeek-blue code graph revealed by an ink bloom: pulses of light flow inward along curved edges, focus rings ripple and rotate, and dim peripheral nodes twinkle.</desc>
  <defs>
    <radialGradient id="fovea" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#dce7ff" stop-opacity="0.98"/>
      <stop offset="13%" stop-color="#83b4ff" stop-opacity="0.92"/>
      <stop offset="30%" stop-color="#4d6bfe" stop-opacity="0.68"/>
      <stop offset="58%" stop-color="#293ca8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#080b16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26304a" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#83b4ff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#26304a" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d6bfe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4d6bfe" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4d6bfe" stop-opacity="0"/>
    </linearGradient>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="90" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="reveal">
      <rect width="1100" height="360" fill="black"/>
      <circle cx="550" cy="180" r="0" fill="white" filter="url(#ink)">
        <animate attributeName="r" values="0;0;720" keyTimes="0;0.0909;1" dur="11s" fill="freeze" calcMode="spline" keySplines="0 0 1 1; 0.22 0.61 0.36 1"/>
      </circle>
    </mask>
  </defs>
  <rect width="1100" height="360" rx="18" fill="#080b16"/>
